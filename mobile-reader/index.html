<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>墨韵 · 读者</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --card: #0f3460;
  --accent: #e94560;
  --accent2: #533483;
  --text: #eee;
  --text2: #999;
  --border: #2a2a4a;
  --radius: 12px;
}
html, body { height: 100%; }
body {
  font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ====== Screens ====== */
.screen { display: none; position: fixed; inset: 0; flex-direction: column; }
.screen.active { display: flex; }

/* ====== Loading ====== */
#loadingScreen { justify-content: center; align-items: center; gap: 16px; }
.spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ====== Header ====== */
.header {
  display: flex; align-items: center; padding: 12px 16px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0; min-height: 52px;
}
.header h1 { font-size: 17px; font-weight: 600; flex: 1; }
.header .btn {
  background: transparent; border: none; color: var(--text2);
  font-size: 14px; padding: 6px 10px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.header .btn:active { opacity: 0.5; }
.header .btn-back { font-size: 20px; padding: 6px 10px 6px 4px; }

/* ====== Login ====== */
#loginScreen { justify-content: center; align-items: center; padding: 24px; }
.login-box {
  width: 100%; max-width: 340px;
  background: var(--surface); border-radius: var(--radius);
  padding: 32px 24px; text-align: center;
}
.login-box h1 { font-size: 24px; margin-bottom: 4px; }
.login-box p { font-size: 12px; color: var(--text2); margin-bottom: 24px; }
.login-box input {
  width: 100%; padding: 12px 14px; margin-bottom: 10px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 15px;
  outline: none;
}
.login-box input:focus { border-color: var(--accent); }
.login-box .login-btn {
  width: 100%; padding: 12px;
  background: var(--accent); color: #fff; border: none;
  border-radius: 8px; font-size: 16px; font-weight: 600;
  cursor: pointer; margin-top: 4px;
  -webkit-tap-highlight-color: transparent;
}
.login-box .login-btn:active { opacity: 0.8; }
.login-error { color: var(--accent); font-size: 12px; min-height: 20px; margin-top: 8px; }
.login-box .server-hint { font-size: 11px; color: var(--text2); margin-top: 16px; }

/* ====== Shelf ====== */
.shelf-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; }
.book-grid { display: flex; flex-direction: column; gap: 12px; }
.book-card {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface); border-radius: var(--radius);
  padding: 16px; cursor: pointer; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.book-card:active { opacity: 0.7; }
.book-cover {
  width: 48px; height: 60px; border-radius: 6px;
  flex-shrink: 0;
}
.book-info { flex: 1; min-width: 0; }
.book-info h3 { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.book-info .meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
.book-info .arrow { font-size: 18px; color: var(--text2); }
.empty-shelf { text-align: center; padding: 60px 0; color: var(--text2); font-size: 14px; }

/* ====== Chapter List ====== */
.chapter-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.volume-group { margin-bottom: 4px; }
.volume-title {
  padding: 14px 16px 6px; font-size: 14px; font-weight: 600;
  color: var(--accent);
}
.chapter-item {
  display: flex; align-items: center; padding: 12px 16px 12px 28px;
  cursor: pointer; border-bottom: 1px solid var(--border);
  -webkit-tap-highlight-color: transparent;
}
.chapter-item:active { background: var(--card); }
.chapter-item .ch-title { font-size: 15px; flex: 1; }
.chapter-item .ch-len { font-size: 11px; color: var(--text2); margin-left: 8px; }

/* ====== Reader ====== */
.reader-scroll {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 0 20px;
}
.reader-content {
  padding: 20px 0 60px;
  font-size: 17px; line-height: 1.9;
  color: var(--text);
}
.reader-content h2 {
  font-size: 20px; font-weight: 600; text-align: center;
  margin-bottom: 20px; padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.reader-content p { margin: 0.6em 0; }
.reader-content img { max-width: 100%; height: auto; }
.reader-nav {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 20px; background: var(--surface);
  border-top: 1px solid var(--border); flex-shrink: 0;
}
.reader-nav .nav-btn {
  background: var(--card); border: none; color: var(--text);
  padding: 10px 20px; border-radius: 8px; font-size: 14px;
  cursor: pointer; min-width: 80px; text-align: center;
  -webkit-tap-highlight-color: transparent;
}
.reader-nav .nav-btn:disabled { opacity: 0.3; }
.reader-nav .nav-btn:active:not(:disabled) { opacity: 0.7; }
.reader-nav .nav-label { font-size: 12px; color: var(--text2); }

/* ====== Toast ====== */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.8); color: #fff; padding: 10px 20px;
  border-radius: 8px; font-size: 13px; z-index: 999;
  transition: opacity 0.3s; opacity: 0; pointer-events: none;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="loadingScreen" class="screen active">
  <div class="spinner"></div>
  <div style="color:var(--text2);font-size:14px;">加载中...</div>
</div>

<div id="loginScreen" class="screen">
  <div class="login-box">
    <h1>墨韵</h1>
    <p>手机阅读器</p>
    <input type="email" id="emailInput" placeholder="邮箱地址" autocomplete="email">
    <input type="password" id="passwordInput" placeholder="密码" autocomplete="current-password">
    <button class="login-btn" onclick="handleLogin()">登录</button>
    <div class="login-error" id="loginError"></div>
    <div class="server-hint" id="serverHint"></div>
  </div>
</div>

<div id="shelfScreen" class="screen">
  <div class="header">
    <h1>墨韵</h1>
    <button class="btn" onclick="refreshData()">🔄</button>
    <button class="btn" onclick="handleLogout()">退出</button>
  </div>
  <div class="shelf-scroll" id="shelfScroll">
    <div class="book-grid" id="bookGrid"></div>
  </div>
</div>

<div id="chapterScreen" class="screen">
  <div class="header">
    <button class="btn btn-back" onclick="showShelf()">‹</button>
    <h1 id="chapterBookTitle">书</h1>
  </div>
  <div class="chapter-scroll" id="chapterScroll"></div>
</div>

<div id="readerScreen" class="screen">
  <div class="header">
    <button class="btn btn-back" onclick="showChapters()">‹</button>
    <h1 id="readerChapterTitle">章节</h1>
  </div>
  <div class="reader-scroll" id="readerScroll">
    <div class="reader-content" id="readerContent"></div>
  </div>
  <div class="reader-nav" id="readerNav"></div>
</div>

<div class="toast" id="toast"></div>

<script>
var _apiBase = '';
var _token = null;
var _user = null;
var _books = [];
var _currentBook = null;
var _chapters = [];
var _chapterIndex = -1;

/* ====== Init ====== */
initReader();

function initReader() {
  _apiBase = window.location.origin;
  document.getElementById('serverHint').textContent = '服务器: ' + _apiBase;

  _token = localStorage.getItem('mr_token');
  _user = JSON.parse(localStorage.getItem('mr_user') || 'null');

  if (_token && _user) {
    showScreen('loadingScreen');
    validateToken();
  } else {
    showScreen('loginScreen');
    hideLoading();
  }
}

/* ====== Screen Management ====== */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

/* ====== Loading ====== */
function showLoading() {
  var ls = document.getElementById('loadingScreen');
  ls.style.display = 'flex';
  ls.classList.add('active');
}
function hideLoading() {
  var ls = document.getElementById('loadingScreen');
  ls.style.display = 'none';
  ls.classList.remove('active');
}

/* ====== Toast ====== */
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer); t._timer = setTimeout(function() { t.classList.remove('show'); }, 2000);
}

/* ====== API ====== */
async function api(method, path, body) {
  var opts = { method: method, headers: { 'Content-Type': 'application/json' } };
  if (_token) opts.headers['Authorization'] = 'Bearer ' + _token;
  if (body !== undefined) opts.body = JSON.stringify(body);

  var resp = await fetch(_apiBase + path, opts);
  var data = await resp.json();
  if (!resp.ok) throw new Error(data.error || '请求失败');
  return data;
}

/* ====== Auth ====== */
async function validateToken() {
  try {
    await api('GET', '/api/auth/me');
    // 自动检测并清除本地没数据的脏 token
    loadBookshelf();
  } catch (e) {
    localStorage.removeItem('mr_token');
    localStorage.removeItem('mr_user');
    _token = null; _user = null;
    showScreen('loginScreen');
    hideLoading();
  }
}

async function handleLogin() {
  var email = document.getElementById('emailInput').value.trim();
  var password = document.getElementById('passwordInput').value;
  var errEl = document.getElementById('loginError');
  if (!email || !password) { errEl.textContent = '请填写邮箱和密码'; return; }

  errEl.textContent = '';
  var btn = document.querySelector('.login-btn');
  btn.textContent = '登录中...'; btn.disabled = true;

  try {
    var data = await api('POST', '/api/auth/login', { email: email, password: password });
    _token = data.token;
    _user = data.user;
    localStorage.setItem('mr_token', _token);
    localStorage.setItem('mr_user', JSON.stringify(_user));
    loadBookshelf();
  } catch (e) {
    errEl.textContent = e.message;
    btn.textContent = '登录'; btn.disabled = false;
  }
}

function handleLogout() {
  localStorage.removeItem('mr_token');
  localStorage.removeItem('mr_user');
  _token = null; _user = null; _books = []; _currentBook = null;
  document.getElementById('emailInput').value = '';
  document.getElementById('passwordInput').value = '';
  document.getElementById('loginError').textContent = '';
  showScreen('loginScreen');
}

/* ====== Bookshelf ====== */
function showShelf() { showScreen('shelfScreen'); }

async function loadBookshelf() {
  showScreen('loadingScreen');
  try {
    var data = await api('GET', '/api/sync/data');
    _books = data.books || [];
    renderShelf();
    showScreen('shelfScreen');
    hideLoading();
  } catch (e) {
    hideLoading();
    showToast('加载失败: ' + e.message);
    showScreen('shelfScreen');
    renderShelf();
  }
}

function renderShelf() {
  var grid = document.getElementById('bookGrid');
  if (!_books.length) {
    grid.innerHTML = '<div class="empty-shelf">暂无书籍</div>';
    return;
  }
  grid.innerHTML = _books.map(function(b) {
    var color = b.cover_color || '#8b5a2b';
    var char = b.title.charAt(0) || '书';
    return '<div class="book-card" onclick="openBook(\'' + b.id + '\')">' +
      '<div class="book-cover" style="background:' + color + ';display:flex;align-items:center;justify-content:center;font-size:22px;color:rgba(255,255,255,0.8)">' + char + '</div>' +
      '<div class="book-info"><h3>' + escHtml(b.title) + '</h3></div>' +
      '<span class="arrow">›</span></div>';
  }).join('');
}

async function refreshData() {
  showToast('同步中...');
  try { await loadBookshelf(); showToast('同步完成'); }
  catch (e) { showToast('同步失败'); }
}

/* ====== Chapter List ====== */
async function openBook(bookId) {
  showScreen('loadingScreen');
  _currentBook = _books.find(function(b) { return b.id === bookId; });
  try {
    var data = await api('GET', '/api/sync/data');
    var bd = data.bookData[bookId];
    _chapters = bd ? (bd.chapters || []) : [];
    var volumes = bd ? (bd.volumes || []) : [];

    // Try to get volume info, fallback to flat list
    renderChapterList(volumes, _chapters);
    document.getElementById('chapterBookTitle').textContent = (_currentBook && _currentBook.title) || '书籍';
    showScreen('chapterScreen');
    hideLoading();
  } catch (e) {
    hideLoading();
    showToast('加载章节失败');
  }
}

function renderChapterList(volumes, chapters) {
  var scroll = document.getElementById('chapterScroll');
  if (!chapters.length) {
    scroll.innerHTML = '<div class="empty-shelf" style="padding-top:80px;">暂无章节</div>';
    return;
  }

  // Group by volume
  var volumeMap = {};
  volumes.forEach(function(v) { volumeMap[v.id] = v; });

  var html = '';
  if (volumes.length) {
    volumes.forEach(function(v) {
      var vChs = chapters.filter(function(c) { return c.volumeId === v.id; });
      if (!vChs.length) return;
      html += '<div class="volume-group"><div class="volume-title">' + escHtml(v.title) + '</div>';
      vChs.forEach(function(c) {
        var len = c.content ? c.content.length : (c._contentLen || 0);
        var lenText = len > 1000 ? Math.round(len / 100) / 10 + 'k' : (len || '');
        html += '<div class="chapter-item" onclick="openReader(\'' + c.id + '\')">' +
          '<span class="ch-title">' + escHtml(c.title) + '</span>' +
          (lenText ? '<span class="ch-len">' + lenText + '</span>' : '') +
          '</div>';
      });
      html += '</div>';
    });
  } else {
    // Flat list
    chapters.forEach(function(c) {
      html += '<div class="chapter-item" onclick="openReader(\'' + c.id + '\')">' +
        '<span class="ch-title">' + escHtml(c.title) + '</span></div>';
    });
  }
  scroll.innerHTML = html;
}

function showChapters() { showScreen('chapterScreen'); }

/* ====== Reader ====== */
async function openReader(chapterId) {
  showScreen('loadingScreen');
  var idx = _chapters.findIndex(function(c) { return c.id === chapterId; });
  if (idx === -1) { hideLoading(); showToast('章节不存在'); return; }
  _chapterIndex = idx;

  var ch = _chapters[idx];
  document.getElementById('readerChapterTitle').textContent = ch.title;

  try {
    var data = await api('GET', '/api/sync/data');
    var bd = data.bookData[_currentBook.id];
    var content = '';

    // Try to get content from bookData contents map
    if (bd && bd.contents && bd.contents[chapterId]) {
      content = bd.contents[chapterId];
    } else {
      // Try direct content_ key
      var allKeys = Object.keys(bd || {});
      var contentKey = allKeys.find(function(k) { return k === 'content_' + chapterId; });
      if (contentKey) content = bd[contentKey];
    }

    renderReader(ch, content);
    showScreen('readerScreen');
    hideLoading();
    document.getElementById('readerScroll').scrollTop = 0;
  } catch (e) {
    hideLoading();
    showToast('加载内容失败');
  }
}

function renderReader(chapter, content) {
  var el = document.getElementById('readerContent');

  // If content looks like HTML, render as-is; otherwise treat as plain text
  var isHtml = /<[a-z][\s\S]*>/i.test(content);
  el.innerHTML = '<h2>' + escHtml(chapter.title) + '</h2>' + (isHtml ? content : '<p>' + escHtml(content).replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>') + '</p>');

  // Navigation
  var nav = document.getElementById('readerNav');
  var prevBtn = '<button class="nav-btn" onclick="prevChapter()"' + (_chapterIndex <= 0 ? ' disabled' : '') + '>‹ 上一章</button>';
  var label = '<span class="nav-label">' + (_chapterIndex + 1) + ' / ' + _chapters.length + '</span>';
  var nextBtn = '<button class="nav-btn" onclick="nextChapter()"' + (_chapterIndex >= _chapters.length - 1 ? ' disabled' : '') + '>下一章 ›</button>';
  nav.innerHTML = prevBtn + label + nextBtn;
}

function prevChapter() {
  if (_chapterIndex > 0) openReader(_chapters[_chapterIndex - 1].id);
}
function nextChapter() {
  if (_chapterIndex < _chapters.length - 1) openReader(_chapters[_chapterIndex + 1].id);
}

/* ====== Swipe navigation ====== */
(function() {
  var startX = 0, startY = 0, handled = false;
  document.addEventListener('touchstart', function(e) {
    var el = document.getElementById('readerScreen');
    if (!el.classList.contains('active')) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    handled = false;
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (handled) return;
    var el = document.getElementById('readerScreen');
    if (!el.classList.contains('active')) return;
    var rs = document.getElementById('readerScroll');
    var scrollTop = rs.scrollTop;
    var scrollH = rs.scrollHeight - rs.clientHeight;

    // Only handle horizontal swipe when at top/bottom of content
    // or when horizontal distance > vertical
    var dx = e.touches[0].clientX - startX;
    var dy = e.touches[0].clientY - startY;

    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60) {
      handled = true;
      if (dx > 0 && _chapterIndex > 0) prevChapter();
      else if (dx < 0 && _chapterIndex < _chapters.length - 1) nextChapter();
    }
  }, { passive: true });
})();

/* ====== Util ====== */
function escHtml(s) {
  if (!s) return '';
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
</script>
</body>
</html>
